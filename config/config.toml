# ─────────────────────────────────────────────────────────────────────────────
# moma-social — configurazione dell'agente
# Questo file e' versionato e NON contiene segreti: i valori ${NOME_VAR} sono
# risolti a runtime dalle variabili d'ambiente (.env in locale, GitHub Secrets
# in CI). Per override locali crea config/config.local.toml (git-ignored):
# viene unito sopra a questo file chiave per chiave.
# ─────────────────────────────────────────────────────────────────────────────

[org]
name          = "Modena Magic"
city          = "Modena"
handle        = "@modenamagic"             # DA CONFERMARE: handle Instagram reale
site          = "https://esempio.it"       # DA COMPLETARE
timezone      = "Europe/Rome"              # tutti gli orari nei log/schedule
locale        = "it_IT"

[brand]
# Colori usati dai template HTML se NON viene fornito uno sfondo grafico.
primary       = "#1C1C1C"     # nero della grafica Modena Magic
accent        = "#A5CE39"     # verde lime dei titoli e delle posizioni
text          = "#FFFFFF"
muted         = "#B8B8B8"
# Font: se metti un .ttf/.woff2 in templates/images/fonts/ indicane qui il nome.
# League Gothic e' incorporata nelle slide (templates/images/fonts/, SIL OFL).
# I fallback servono solo se il file sparisce.
font_family   = "'League Gothic', 'Arial Narrow', 'Helvetica Neue Condensed', sans-serif"
logo          = "templates/images/assets/logo.png"   # opzionale

[render]
# I PNG finiscono in out/<data del lancio>/: un giro non si mescola con il
# precedente. `false` li mette tutti nella stessa cartella.
cartella_per_giorno = true
# Dimensione predefinita delle slide. Ogni post puo' sovrascriverla con
# `width` e `height` nella propria sezione [posts.*]: i template grafici non
# hanno tutti lo stesso formato, e il feed Instagram accetta sia 1:1 sia 4:5.
width         = 1080      # formato feed Instagram 4:5
height        = 1350
scale         = 2         # deviceScaleFactor: esporta a 2160x2700
output_dir    = "out"
# backend: "chromium" (headless CLI, zero dipendenze) | "playwright"
backend       = "chromium"
# Lasciato vuoto: cerca chrome/chromium nel PATH e in PLAYWRIGHT_BROWSERS_PATH
chromium_path = ""

# ─────────────────────────────────────────────────────────────────────────────
# SORGENTI DATI
# Ogni sorgente accetta: url, kind (auto|json|csv|sql|yaml), root, query,
# headers, params, map. `map` traduce i campi della vostra sorgente nei campi
# del modello interno: "campo_interno" = "campo_sorgente".
# Placeholder disponibili in url/params/query: {date_from} {date_to} {date}
# {format} {season} — sostituiti a runtime (filtro server-side, opzionale:
# se la sorgente non li supporta il filtro viene comunque riapplicato in locale).
# ─────────────────────────────────────────────────────────────────────────────

# ── SUPABASE ────────────────────────────────────────────────────────────────
# Supabase espone le tabelle via PostgREST: un endpoint REST che restituisce
# JSON, quindi si configura come una qualunque API. Da preferire alla
# connessione Postgres diretta, che risolve solo in IPv6 e quindi NON
# funziona dai runner di GitHub Actions (vedi docs/SUPABASE.md).
#
# [sources.results]
# url = "https://<ref>.supabase.co/rest/v1/risultati?select=*&data=eq.{date}&order=posizione.asc"
#
# [sources.results.headers]
# apikey        = "${SUPABASE_KEY}"
# Authorization = "Bearer ${SUPABASE_KEY}"
#
# [sources.results.map]
# date = "data"
# rank = "posizione"
# ────────────────────────────────────────────────────────────────────────────

[sources.events]
# Vista v_social_eventi sul Supabase dell'associazione: espone i soli tornei di
# Modena Magic, senza dati personali. L'URL del progetto non e' un segreto (e'
# pubblico per progettazione); la chiave sta in SUPABASE_KEY.
url  = "https://wxvxtodrnrefbechawgz.supabase.co/rest/v1/v_social_eventi?select=*&data=gte.{date_from}&data=lte.{date_to}&order=data.asc"
kind = "json"

[sources.events.headers]
apikey        = "${SUPABASE_KEY}"
Authorization = "Bearer ${SUPABASE_KEY}"

[sources.events.map]
date      = "data"
title     = "titolo"
format    = "formato"
venue     = "sede"
# `indirizzo` esiste nella vista ma NON si mappa: a database e' una stringa di
# geocodifica ("88, Via Cesare Balbo, Sacca, Crocetta-San Lazzaro-Modena Est,
# Modena, Emilia-Romagna, 41122, Italia"), buona per una mappa e illeggibile su
# una locandina. Sulla card va quello scritto in [content.evento].
entry_fee = "quota"      # tournaments.costo, formattata dall'agente
notes     = "note"
league    = "lega"       # nome della lega, prima riga del titolo
stage     = "tappa"      # numero di tappa, seconda riga: "Tappa 3"
tournament_id = "torneo_id"
signup_url = "signup_url"
# Ora e premi non sono nella vista: restano in [content.evento]. L'URL della
# pagina del torneo e' esposto per il QR delle storie.
# Tutte le altre colonne arrivano da supabase/v_social_eventi.sql: finche'
# quella vista non e' aggiornata, la card ricade sui valori di configurazione.

[sources.results]
url  = "https://wxvxtodrnrefbechawgz.supabase.co/rest/v1/v_social_risultati?select=*&data=eq.{date}&order=posizione.asc"
kind = "json"

[sources.results.headers]
apikey        = "${SUPABASE_KEY}"
Authorization = "Bearer ${SUPABASE_KEY}"

[sources.results.map]
date          = "data"
format        = "formato"
leg           = "torneo"
rank          = "posizione"
player        = "giocatore"
points        = "punti"
# La vista espone i tre numeri separati: il record ("3-0-1") lo compone
# l'agente, cosi' i pareggi non si perdono e il formato resta una scelta
# di presentazione.
league        = "lega_id"     # a quale lega appartiene la tappa
wins          = "vinte"
losses        = "perse"
draws         = "pari"
deck          = "mazzo"
players_count = "iscritti"

# La classifica di lega e' calcolata a runtime dalla webapp: non esiste ancora
# una vista da interrogare. Finche' manca, questa sorgente resta sui dati di
# esempio e il carosello dei risultati non va pubblicato.
[sources.standings]
# Vista v_social_classifica: traduzione in SQL di computeLeagueStandings della
# webapp (vedi supabase/v_social_classifica.sql). E' una SECONDA implementazione
# della stessa regola: se il punteggio cambia nell'app e non nella vista,
# l'agente pubblica numeri che smentiscono l'app senza che nulla lo segnali.
# Va confrontata con la classifica dell'app prima di ogni cambio di regole.
#
# Se piu' leghe condividono lo stesso formato, qui servira' un filtro
# aggiuntivo su stato_lega o lega_id: la vista li espone apposta.
# Nessun filtro sul formato nell'URL: PostgREST distingue maiuscole e
# minuscole, mentre il confronto interno tollera differenze di grafia. Un
# filtro server-side piu' severo del nostro scarta righe che avremmo accettato,
# e lo fa in silenzio. La classifica e' piccola: si scarica e si filtra qui.
url  = "https://wxvxtodrnrefbechawgz.supabase.co/rest/v1/v_social_classifica?select=*&order=posizione.asc"
kind = "json"

[sources.standings.headers]
apikey        = "${SUPABASE_KEY}"
Authorization = "Bearer ${SUPABASE_KEY}"

[sources.standings.map]
format        = "formato"
season        = "lega"
league        = "lega_id"     # filtra la classifica sulla lega della tappa
rank          = "posizione"
player        = "giocatore"
points        = "punti"
events_played = "tappe"
league_status = "stato_lega"  # decide quali leghe entrano nel post del lunedi
# `delta` non e' calcolabile: la webapp non conserva lo storico delle posizioni,
# quindi le frecce di tendenza restano vuote.

[instagram]
enabled        = true
ig_user_id     = "${IG_USER_ID}"
access_token   = "${IG_ACCESS_TOKEN}"     # long-lived token, mai committato
api_version    = "v21.0"
# Come ci si autentica. "graph.instagram.com" = Instagram Login: si autorizza
# l'account Instagram e basta. "graph.facebook.com" = Facebook Login, che
# richiede una Pagina Facebook collegata. Le chiamate sono identiche.
api_host       = "graph.instagram.com"
# Profili da taggare come coautori del post (i "Collab" di Instagram). Devono
# accettare l'invito, altrimenti il post resta solo sul nostro profilo.
# Campo giovane della API: se Meta lo rifiuta, l'errore lo dice e basta
# svuotare questa lista.
collaborators  = ["uno.critico"]
# Dove si annota da quando gira il token. Meta, su Instagram Login, non dice
# quanta vita gli resti: il conto lo tiene il controllo giornaliero, e questo
# file e' la sua memoria (dentro c'e' un'impronta, non il token).
token_state    = "state/token.json"
# Kill switch globale: se false ogni pipeline si ferma prima della pubblicazione
# e lascia solo i file in out/ (utile per pausa senza toccare i workflow).
publish_enabled = true

# ─────────────────────────────────────────────────────────────────────────────
# HOSTING IMMAGINI — la Graph API scarica le immagini da un URL PUBBLICO,
# quindi i PNG generati vanno caricati da qualche parte prima di pubblicare.
# backend: "s3" (S3/R2/MinIO) | "imgbb" | "none" (solo dry-run/export locale)
# ─────────────────────────────────────────────────────────────────────────────
[media]
backend     = "imgbb"

[media.s3]
bucket      = "${MEDIA_BUCKET}"
prefix      = "instagram/"
region      = "${AWS_REGION}"
endpoint_url = ""                          # valorizza per Cloudflare R2 / MinIO
public_base = "${MEDIA_PUBLIC_BASE}"       # es. https://cdn.esempio.it
acl         = "public-read"

[media.imgbb]
api_key     = "${IMGBB_API_KEY}"
# Secondi dopo i quali imgbb cancella il file. Instagram lo scarica in pochi
# minuti e poi ne tiene una copia sua, quindi un giorno e' gia' abbondante e
# non lascia nostre immagini su un server altrui piu' del necessario.
# Minimo accettato da imgbb: 60. 0 = non scade mai.
expiration  = 86400

# ─────────────────────────────────────────────────────────────────────────────
# CONTENUTI
# ─────────────────────────────────────────────────────────────────────────────
[content]
hashtags_base   = ["#modenamagic", "#magicthegathering", "#mtg", "#tcg"]
# Nome del torneo mostrato nel titolo della grafica. {format} = formato di gioco.
tournament_name = "Torneo {format}"
leg_kicker         = "Risultati di tappa"   # occhiello della slide tappa
standings_subtitle = "Classifica generale"  # occhiello della slide classifica
standings_title    = "Classifica"           # titolo grande della slide classifica
meta_titolo        = "Il meta"              # titolo della slide sugli archetipi
meta_altri         = "Altri"
meta_ignoto        = "Non dichiarato"
hashtag_grafica = "#modenamagic"          # hashtag stampato in fondo alla slide
hashtags_max    = 20
caption_max     = 2200          # limite Instagram
# ── Card evento (grafica "Template Evento Dark") ─────────────────────────────
# I testi si compongono da questi modelli. Segnaposto disponibili:
#   {format} {weekday} {giorno} {data} {title} {venue} {city} {fee} {time} {org}
# I dati che il database non espone ancora — ora di inizio, quota, link
# iscrizioni — stanno qui: cambiarli non richiede di toccare il codice.
# Limiti consigliati dal grafico: titolo 22 caratteri, quando 30, dove 28,
# iscrizione 26, link 34. Oltre, il testo va a capo e rompe il ritmo.
[content.evento]
kicker_1          = "Evento settimanale"
kicker_2          = "{city}"
kicker_calendario = "Calendario settimanale"   # riga 1 delle slide del lunedi
badge             = "{format}"
# Titolo di una tappa di lega: sopra il nome della lega, sotto questa riga.
titolo_tappa      = "Tappa {stage}"
titolo_finale     = "Finale"
titolo_settimana  = "La settimana"            # card di riepilogo del lunedi
ora_default       = "21:00"                   # nell'elenco della settimana
# Usato solo quando non c'e' nessun evento in sorgente (post da fallback).
titolo            = "{weekday} {format}"
quando            = "{giorno}, 21:00"          # usata se la sorgente non ha l'ora
dove              = "Uno Critico"              # usata se l'evento non ha sede
# Riga piccola sotto la sede. Compare solo se la sede e' quella qui sopra:
# accostare questo indirizzo a un'altra sede indicherebbe il posto sbagliato.
indirizzo         = "Via Cesare Balbo, 88/B, Modena"
invito            = "Iscriviti"
link              = "https://modena-magic.vercel.app/tornei"
qr                = ""                         # PNG del QR; vuoto = nessun QR

# Quota per formato, usata quando l'evento non la porta con se'. Il Pauper
# non costa come il Limited: tenerla qui evita di scriverla torneo per torneo.
[content.evento.quota]
default = "10 €"
pauper  = "7 €"
limited = "25 €"

# Fallback formati per giorno se la sorgente eventi non copre quel giorno
[content.formats_by_weekday]
wednesday = ""
thursday  = ""

# ─────────────────────────────────────────────────────────────────────────────
# CANVA — recupero degli sfondi grafici (opzionale)
# Si usa a mano con `momasocial canva-sync`, NON dai workflow schedulati:
# l'OAuth di Canva ha refresh token monouso e una catena rotta richiede una
# riautorizzazione dal browser. I workflow leggono i PNG committati nel repo.
#   1. momasocial canva-auth   (una volta sola, dalla tua macchina)
#   2. momasocial canva-sync   (quando il grafico cambia qualcosa)
# ─────────────────────────────────────────────────────────────────────────────
[canva]
client_id      = "${CANVA_CLIENT_ID}"
client_secret  = "${CANVA_CLIENT_SECRET}"
redirect_port  = 8721                       # http://127.0.0.1:8721 su Canva
token_file     = "config/canva-tokens.json" # git-ignored, contiene i token
export_quality = "regular"                  # "pro" richiede un piano a pagamento

# Un blocco per ogni sfondo. `design_id` e' il PRIMO segmento dopo /design/
# nell'URL Canva; il secondo e' il token del link e non va messo qui:
#   https://www.canva.com/design/DAF5kNaAdDU/sNtVNbJOh1j7RmAGeIgfUA/edit
#                                ^^^^^^^^^^^ = design_id
# `page` serve se un solo design contiene piu' sfondi su pagine diverse.
# [[canva.assets]]
# design_id = "DAFxxxxxxxx"
# page      = 1
# target    = "templates/images/assets/sfondo_calendario.png"
#
# [[canva.assets]]
# design_id = "DAFyyyyyyyy"
# target    = "templates/images/assets/sfondo_formato.png"

[[canva.assets]]
design_id = "DAHT8FDdlJs"
target    = "templates/images/assets/sfondo_classifica.png"

[publish]
# Registro versionato delle pubblicazioni: garantisce l'idempotenza fra run
# diversi (un workflow rilanciato non produce un doppione).
ledger = "state/published.jsonl"

# Il lunedi esce un carosello: una card per evento della settimana, cosi'
# ogni appuntamento resta leggibile invece di stare in una riga minuscola.
[posts.weekly_calendar]
# "prossima": lanciato il sabato, annuncia la settimana che comincia.
# "corrente": racconta la settimana che contiene la data di lancio.
settimana           = "prossima"
tema                = "arancione"   # fondo arancione, testi scuri, etichette bianche
image_template      = "evento.html.j2"
# Prima slide: tutta la settimana in un colpo d'occhio, poi una card per
# serata. `riepilogo = false` la toglie e lascia il solo carosello di card.
image_template_riepilogo = "settimana.html.j2"
riepilogo           = true
caption_template    = "weekly_calendar.txt.j2"
hashtags            = ["#tornei", "#calendario"]
max_carousel_slides = 10        # la Graph API non ne accetta di piu'

# Il 30 di ogni mese (l'ultimo giorno nei mesi piu' corti) esce il calendario
# del mese successivo: copertina e appuntamenti raggruppati per data/ora.
[posts.monthly_calendar]
image_template_cover = "mensile_copertina.html.j2"
image_template       = "mensile_elenco.html.j2"
caption_template    = "monthly_calendar.txt.j2"
hashtags            = ["#tornei", "#calendario"]
rows_per_slide      = 8
max_carousel_slides = 10

# Lunedi: una slide per lega con la top 8, a colori invertiti per staccarsi
# dagli altri post nel feed.
[posts.standings_update]
image_template      = "classifica.html.j2"
caption_template    = "standings_update.txt.j2"
hashtags            = ["#classifica", "#lega"]
tema                = "verde"
top_n               = 8
max_carousel_slides = 10
# Stati di `leagues.status` da pubblicare. Il database ne usa due, "aperto" e
# "chiuso": teniamo solo le leghe aperte, perche' le 35 chiuse sono stagioni
# gia' archiviate. Lista vuota = tutte.
stati               = ["aperto"]

[posts.format_spotlight]
image_template   = "evento.html.j2"
caption_template = "format_spotlight.txt.j2"
hashtags         = ["#torneomagic"]

[posts.story_event]
image_template = "storia_evento.html.j2"
width = 1080
height = 1920

[posts.leg_results]
# Il template grafico dell'associazione e' quadrato e vale per entrambe le
# slide del carosello: cambiano solo titolo, sottotitolo e righe.
image_templates  = ["classifica.html.j2"]
# Ultima slide del carosello: le quote degli archetipi della serata.
image_template_meta = "meta.html.j2"
meta_top_n       = 5            # oltre, si accorpa in "Altri"
# Stessa grafica per entrambe le slide del carosello.
background       = "templates/images/assets/sfondo_classifica.png"
caption_template = "leg_results.txt.j2"
hashtags         = ["#classifica", "#risultati"]
# Righe per slide: la grafica ne prevede 16 su due colonne. Con piu'
# partecipanti il post diventa un carosello con piu' slide di risultati.
# Trattamento dietro nome e punti: "strip" (striscia piena), "shadow" (alone
# scuro attorno al testo) o "none" (testo nudo sulla foto).
row_style          = "shadow"
rows_per_slide     = 16
# 0 = tutti i partecipanti. Un numero li limita ai primi N.
top_n              = 0
standings_top_n    = 16
# La Graph API accetta al massimo 10 elementi per carosello (l'app 20, ma
# noi pubblichiamo via API). Oltre questo limite le slide vengono tagliate,
# partendo dalla classifica.
max_carousel_slides = 10

# Seconda slide del carosello (classifica generale): puo' avere uno sfondo
# proprio. Se il file non c'e' ancora, la slide usa il fondo generato dai
# colori brand, senza rompersi.
[posts.leg_results_standings]
background = "templates/images/assets/sfondo_classifica.png"
