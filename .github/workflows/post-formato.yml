name: Storie tornei del giorno

# Primo tentativo dalle 10:07 Europe/Rome, poi ogni mezz'ora circa:
# GitHub puo' ritardare o saltare gli scatti, quindi si tenta due volte l'ora.
# `--recupera` lascia passare il primo scatto utile; il registro blocca i doppioni.
on:
  schedule:
    - cron: "7,37 8-17 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Data di lancio (AAAA-MM-GG, default oggi): eventi oggi e domani"
        required: false
      format:
        description: "Forza il formato di gioco (di norma si deduce dal calendario)"
        required: false
      tournament_id:
        description: "UUID completo di un torneo (senza data o formato)"
        required: false
      dry_run:
        description: "Genera senza pubblicare"
        type: boolean
        default: false
      force:
        description: "Ripubblica anche se la storia risulta già pubblicata"
        type: boolean
        default: false

concurrency:
  group: storie-tornei
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # Primo scatto utile della finestra: gli altri si fermano al registro.
      - name: "A Roma sono almeno le 10:00?"
        id: gate
        if: github.event_name == 'schedule'
        run: momasocial gate --hour 10 --recupera

      - name: Genera e pubblica
        id: post
        if: github.event_name != 'schedule' || steps.gate.outputs.run == 'true'
        env:
          # Gli input del dispatch passano dall'ambiente e vengono quotati in
          # bash: non vanno interpolati nella riga di comando.
          POST_DATE: ${{ inputs.date }}
          POST_FORMAT: ${{ inputs.format }}
          POST_TOURNAMENT_ID: ${{ inputs.tournament_id }}
          POST_DRY_RUN: ${{ inputs.dry_run }}
          POST_FORCE: ${{ inputs.force }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_BUCKET: ${{ secrets.MEDIA_BUCKET }}
          MEDIA_PUBLIC_BASE: ${{ vars.MEDIA_PUBLIC_BASE }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # Le tre viste su Supabase leggono tutte con questa chiave: senza,
          # le intestazioni partono vuote e il post muore su un 401.
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          args=()
          if [ -n "${POST_DATE:-}" ]; then args+=(--date "$POST_DATE"); fi
          if [ -n "${POST_FORMAT:-}" ]; then args+=(--format "$POST_FORMAT"); fi
          if [ -n "${POST_TOURNAMENT_ID:-}" ]; then args+=(--tournament-id "$POST_TOURNAMENT_ID"); fi
          if [ "${POST_DRY_RUN:-}" = "true" ]; then args+=(--dry-run); fi
          if [ "${POST_FORCE:-}" = "true" ]; then args+=(--force); fi

          set +e
          momasocial stories "${args[@]}"
          code=$?
          set -e
          # 78 = nessun torneo nel periodo: esito legittimo, senza artefatti.
          if [ $code -eq 78 ]; then
            echo "::notice::Nessuna storia da pubblicare. Vedi il motivo nel riepilogo della run."
            exit 0
          fi
          exit $code

      - name: Archivia immagini e caption
        if: always() && steps.post.outcome != 'skipped' && steps.post.outputs.status != 'no-data'
        uses: actions/upload-artifact@v4
        with:
          name: storie-tornei-${{ github.run_id }}
          path: out/
          retention-days: 30
          if-no-files-found: ignore

      # Anche quando il post fallisce: il registro porta la riga con l'errore,
      # ed e' l'unica traccia che resta di un guasto notturno dopo che i log
      # della run sono scaduti.
      - name: Aggiorna il registro pubblicazioni
        if: always() && steps.post.outcome != 'skipped' && steps.post.outputs.status != 'no-data'
        uses: ./.github/actions/commit-ledger
