name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Lint
        run: |
          pip install ruff
          ruff check src tests

      - name: Test
        run: |
          pip install pytest responses
          pytest -q

      # Il rendering e' la parte che si rompe in silenzio: si genera un post
      # vero dai dati di esempio e si controlla che il PNG esca della misura
      # giusta, invece di scoprirlo il lunedi mattina.
      - name: Smoke test del rendering
        run: |
          mtgsocial weekly --date 2026-03-11 --no-publish
          mtgsocial results --date 2026-03-11 --no-publish
          python - <<'PY'
          import struct, sys
          from pathlib import Path
          pngs = sorted(Path("out").glob("*.png"))
          assert len(pngs) >= 3, f"attesi almeno 3 PNG, trovati {len(pngs)}"
          for png in pngs:
              w, h = struct.unpack(">II", png.read_bytes()[16:24])
              assert (w, h) == (2160, 2700), f"{png.name}: {w}x{h} invece di 2160x2700"
              print(f"ok {png.name} {w}x{h}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anteprime-${{ github.run_id }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore
