name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Lint
        run: |
          pip install ruff
          ruff check src tests

      - name: Test
        run: |
          pip install pytest responses
          pytest -q

      # Il rendering e' la parte che si rompe in silenzio: si genera un post
      # vero e si controlla che il PNG esca della misura giusta, invece di
      # scoprirlo il lunedi mattina.
      #
      # Le sorgenti puntano ai campioni in data/samples/: la CI non interroga
      # il database dell'associazione. Con la chiave vera ogni push toccherebbe
      # la produzione, e senza la chiave la CI sarebbe rossa per un motivo che
      # col codice non c'entra.
      - name: Smoke test del rendering
        run: |
          python scripts/config_ci.py
          momasocial weekly    --date 2026-03-04 --no-publish
          momasocial results   --date 2026-03-11 --no-publish
          momasocial standings --date 2026-03-16 --no-publish
          python - <<'PY'
          import struct, tomllib
          from pathlib import Path

          # Le misure attese si leggono da config invece di stare scritte qui:
          # cambiare formato al feed non deve far fallire la CI per finta.
          cfg = tomllib.loads(Path("config/config.toml").read_text())
          scala = cfg["render"].get("scale", 2)
          misure = {(cfg["render"]["width"] * scala, cfg["render"]["height"] * scala)}
          for post in cfg.get("posts", {}).values():
              if "width" in post and "height" in post:
                  misure.add((post["width"] * scala, post["height"] * scala))

          # I PNG stanno in una cartella per giorno di lancio, non nella radice.
          pngs = sorted(Path("out").rglob("*.png"))
          assert len(pngs) >= 10, f"attesi almeno 10 PNG, trovati {len(pngs)}"
          for png in pngs:
              w, h = struct.unpack(">II", png.read_bytes()[16:24])
              assert (w, h) in misure, f"{png.name}: {w}x{h} non e' fra {misure}"
              print(f"ok {png.name} {w}x{h}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anteprime-${{ github.run_id }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore
