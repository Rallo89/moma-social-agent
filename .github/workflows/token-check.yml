name: Controllo token Instagram

# Il token dura 60 giorni. Alla scadenza si fermano tutti i post insieme e in
# silenzio, quindi lo si controlla ogni lunedi'.
#
# Sul percorso Instagram Login non esiste un modo di sapere quanto gli resta
# da vivere: si puo' solo chiedere se apre ancora l'account. Per questo il
# primo del mese arriva comunque un promemoria a rinnovarlo — con un token da
# 60 giorni rinnovato ogni mese, la scadenza non si raggiunge mai.
on:
  schedule:
    - cron: "0 7 * * 1"
    - cron: "0 7 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # La logica sta in `momasocial token-status`, dove e' testata: qui
      # dentro sarebbe un heredoc Python in mezzo allo YAML.
      - name: Il token e' ancora buono?
        id: check
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: momasocial token-status

      - name: Apri una issue se serve
        if: steps.check.outputs.state != 'ok' || github.event.schedule == '0 7 1 * *'
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ steps.check.outputs.state }}';
            const days = '${{ steps.check.outputs.days }}';
            const promemoria = state === 'ok';
            const title = promemoria
              ? 'Token Instagram: rinnovo mensile'
              : 'Token Instagram: rinnovo necessario';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'instagram-token',
            });
            if (existing.data.length) return;
            const comando = 'Rinnovalo con `momasocial ig-refresh`, poi aggiorna'
              + ' il secret `IG_ACCESS_TOKEN`.\n\nProcedura completa in'
              + ' `docs/PUBBLICAZIONE.md`.';
            const body = state === 'invalid'
              ? 'Il token Instagram non e\' piu\' valido: **i post automatici sono fermi**.\n\n'
                + comando
              : promemoria
                ? 'Promemoria mensile: il token dura 60 giorni e su Instagram Login non'
                  + ' si puo\' sapere quanto gliene resta.\n\n' + comando
                : `Il token Instagram scade fra **${days} giorni**.\n\n` + comando;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body, labels: ['instagram-token'],
            });
