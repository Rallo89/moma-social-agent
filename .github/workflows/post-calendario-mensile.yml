name: Post calendario mensile

# Il 30 di ogni mese alle 10:00 Europe/Rome: il calendario del mese successivo.
#
# Il cron scatta dal 28 al 31 perche' il 30 in UTC puo' cadere il 29 o il 31
# locale, e perche' a febbraio il 30 non esiste: e' `gate --day-of-month 30`
# a decidere, e nei mesi piu' corti accetta l'ultimo giorno. Senza questo, il
# post di marzo non uscirebbe mai.
on:
  schedule:
    - cron: "0 8,9 28-31 * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Data nel mese PRECEDENTE a quello da pubblicare (AAAA-MM-GG)"
        required: false
      dry_run:
        description: "Genera senza pubblicare"
        type: boolean
        default: false

concurrency:
  group: post-calendario-mensile
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # I cron sono in UTC e non seguono l'ora legale: se ne schedulano due e
      # solo quello che a Roma corrisponde a 10:00 prosegue.
      - name: "E' il 30 alle 10:00 a Roma?"
        id: gate
        if: github.event_name == 'schedule'
        run: momasocial gate --hour 10 --day-of-month 30

      - name: Genera e pubblica
        id: post
        if: github.event_name != 'schedule' || steps.gate.outputs.run == 'true'
        env:
          # Gli input del dispatch passano dall'ambiente e vengono quotati in
          # bash: non vanno interpolati nella riga di comando.
          POST_DATE: ${{ inputs.date }}
          POST_DRY_RUN: ${{ inputs.dry_run }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_BUCKET: ${{ secrets.MEDIA_BUCKET }}
          MEDIA_PUBLIC_BASE: ${{ vars.MEDIA_PUBLIC_BASE }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          EVENTS_API_TOKEN: ${{ secrets.EVENTS_API_TOKEN }}
          RESULTS_API_TOKEN: ${{ secrets.RESULTS_API_TOKEN }}
        run: |
          args=()
          if [ -n "${POST_DATE:-}" ]; then args+=(--date "$POST_DATE"); fi
          if [ "${POST_DRY_RUN:-}" = "true" ]; then args+=(--dry-run); fi

          set +e
          momasocial monthly "${args[@]}"
          code=$?
          set -e
          # 78 = nessun dato per quel giorno: esito legittimo, il post si salta.
          if [ $code -eq 78 ]; then
            echo "::notice::Nessun evento in calendario il mese prossimo: post saltato."
            exit 0
          fi
          exit $code

      - name: Archivia immagini e caption
        if: steps.post.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: post-calendario-mensile-${{ github.run_id }}
          path: out/
          retention-days: 30
          if-no-files-found: ignore

      - name: Aggiorna il registro pubblicazioni
        if: steps.post.outcome == 'success'
        uses: ./.github/actions/commit-ledger
